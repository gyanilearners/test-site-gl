<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#0f766e" />
<title>Gyani Learners — General Knowledge Quiz</title>
<style>
/*==========================
  THEME — Teal / Mint Academic
==========================*/
:root{
/* Primary Tones: Navy to Royal Blue */
  --teal-900: #0a192f; /* Deep Navy */
  --teal-800: #1e3a8a; /* Dark Royal Blue */
  --teal-700: #1d4ed8; /* Main brand color: Royal Blue */
  --teal-600: #2563eb; /* Bright Blue */
  --teal-500: #3b82f6; /* Lighter Blue */

  /* Background/Accent Tones: Warm sunrise colors and White */
  --mint-300: #fef08a; /* Soft Yellow accent */
  --mint-200: #ffedd5; /* Soft Orange accent */
  --mint-100: #ffffff; /* Pure White background */

  /* Text and border colors: Deep navy/slate tones for readability */
  --ink: #020617;      /* Main text color: Almost black/Deepest navy */
  --ink-2: #1e293b;    /* Secondary dark text */
  --muted: #64748b;    /* Muted/grayed out text */
  
  /* Line color: Royal Blue (RGB: 29, 78, 216) to match --teal-700 */
  --line: rgba(29, 78, 216, 0.18);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-dark:rgba(11,31,30,.55);
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --success:#059669;
  --success-soft:#d1fae5;
  --warn:#d97706;
  --warn-soft:#fef3c7;
  --shadow-sm: 0 2px 6px rgba(11,59,57,.08), 0 1px 2px rgba(11,59,57,.05);
  --shadow-md: 0 10px 30px rgba(11,59,57,.10), 0 2px 8px rgba(11,59,57,.06);
  --shadow-lg: 0 24px 60px rgba(11,59,57,.18), 0 6px 16px rgba(11,59,57,.08);
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 24px;
  --blur: 18px;
  --anim: 260ms;
  --fs: 16px;
}
/* Font size scale (Settings) */
html[data-fs="sm"]{ --fs:14px; }
html[data-fs="md"]{ --fs:16px; }
html[data-fs="lg"]{ --fs:18px; }
html[data-fs="xl"]{ --fs:20px; }

/* Animation speed (Settings) */
html[data-anim="off"]{ --anim: 0ms; }
html[data-anim="fast"]{ --anim: 140ms; }
html[data-anim="normal"]{ --anim: 260ms; }
html[data-anim="slow"]{ --anim: 420ms; }

/* Blur (Settings) */
html[data-blur="off"]{ --blur: 0px; }
html[data-blur="low"]{ --blur: 8px; }
html[data-blur="med"]{ --blur: 18px; }
html[data-blur="high"]{ --blur: 28px; }

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0; min-height:100%;
  font-size: var(--fs);
  font-family: "Fraunces","Playfair Display",Georgia,"Iowan Old Style","Apple Garamond",serif;
  color: var(--ink);
  line-height:1.5;
}
body{
  min-height:100vh;
  background:
    linear-gradient(160deg, rgba(230,255,251,.85) 0%, rgba(204,251,241,.75) 40%, rgba(167,243,208,.55) 100%),
    url("https://kommodo.ai/i/YIOOUA4S9v59nDQRdPnN") center center / cover no-repeat fixed,
    linear-gradient(135deg,#e6fffb,#ccfbf1 60%,#a7f3d0);
  background-blend-mode: normal;
  -webkit-font-smoothing: antialiased;
  overflow-x:hidden;
}

/* Soft floating orbs for depth */
body::before,body::after{
  content:""; position:fixed; z-index:0; pointer-events:none;
  filter: blur(60px); opacity:.55;
}
body::before{
  width:420px;height:420px;
  background: radial-gradient(closest-side,#2dd4bf,transparent 70%);
  top:-140px; left:-120px;
}
body::after{
  width:520px;height:520px;
  background: radial-gradient(closest-side,#14958b,transparent 70%);
  right:-160px; bottom:-160px;
}

/* Layout container */
.app{
  position:relative; z-index:1;
  max-width:1120px; margin:0 auto;
  padding: 18px 18px 120px;
}
@media(min-width: 900px){
  .app{ padding: 28px 32px 40px; }
}

/* Top bar */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px;
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  border:1px solid var(--line);
  box-shadow: var(--shadow-md);
  margin-bottom:18px;
  position: sticky; top:12px; z-index:20;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-weight:700; letter-spacing:.2px;
  color:var(--teal-800);
}
.brand-logo{
  width:38px; height:38px; border-radius:12px;
  background: linear-gradient(135deg,var(--teal-700),var(--teal-500));
  display:grid; place-items:center; color:white;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), var(--shadow-sm);
  font-family: "Fraunces", serif;
  font-weight:900; font-size:20px;
}
.brand-name{ font-family:"Fraunces",serif; font-size:1.1rem; }
.brand-name small{ display:block; font-weight:500; color:var(--muted); font-size:.72rem; letter-spacing:.4px;}
.top-spacer{ flex:1; }

.icon-btn{
  appearance:none; border:0; background:transparent;
  width:42px; height:42px; border-radius:12px;
  display:grid; place-items:center;
  color:var(--teal-800); cursor:pointer;
  transition: background var(--anim) ease, transform var(--anim) ease;
}
.icon-btn:hover{ background: rgba(15,118,110,.08); }
.icon-btn:active{ transform: scale(.96); }
.icon-btn svg{ width:22px; height:22px; }

/* Breadcrumb */
.crumb{
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  padding: 6px 12px;
  margin-bottom:14px;
  color:var(--muted); font-size:.85rem;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.crumb a{ color:var(--teal-700); cursor:pointer; text-decoration:none; }
.crumb a:hover{ text-decoration:underline; }
.crumb .sep{ opacity:.55; }

/* Cards / glass surfaces */
.card{
  position:relative;
  background: var(--glass);
  backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  padding: 20px;
  transition: transform var(--anim) ease, box-shadow var(--anim) ease, background var(--anim) ease;
}
.card.solid{ background: var(--glass-strong); }
.card:hover{ box-shadow: var(--shadow-lg); }
.card h2, .card h3{ margin: 0 0 10px; font-family:"Fraunces",serif; color:var(--teal-900); }

/* Section heading */
.section-title{
  display:flex; align-items:end; justify-content:space-between; gap:10px;
  margin: 22px 4px 12px;
}
.section-title h2{
  margin:0; font-family:"Fraunces",serif; font-weight:700;
  font-size: 1.4rem; color:var(--teal-900);
  letter-spacing:.2px;
}
.section-title .hint{ color:var(--muted); font-size:.85rem; font-family: system-ui, sans-serif;}

/* Buttons */
.btn{
  --bg: var(--teal-700);
  --fg: #fff;
  position:relative; overflow:hidden;
  appearance:none; border:0; cursor:pointer;
  padding: 12px 18px; min-height:46px;
  border-radius: 999px;
  background: var(--bg); color: var(--fg);
  font-weight:600; font-family: system-ui, sans-serif; font-size:.95rem;
  letter-spacing:.2px;
  box-shadow: var(--shadow-sm);
  transition: transform var(--anim) ease, box-shadow var(--anim) ease, background var(--anim) ease;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
}
.btn:hover{ box-shadow: var(--shadow-md); }
.btn:active{ transform: translateY(1px) scale(.99); }
.btn.ghost{ --bg: transparent; --fg: var(--teal-800); box-shadow:none; border:1px solid var(--line); }
.btn.ghost:hover{ background: rgba(15,118,110,.06); }
.btn.soft{ --bg: var(--mint-200); --fg: var(--teal-900); }
.btn.dark{ --bg: var(--ink-2); --fg: #e6fffb; }
.btn.danger{ --bg: #fecaca; --fg: #7f1d1d; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }

/* Ripple */
.btn .ripple{
  position:absolute; border-radius:999px; transform: scale(0);
  background: rgba(255,255,255,.55);
  animation: ripple 600ms ease-out forwards;
  pointer-events:none;
}
.btn.ghost .ripple, .btn.soft .ripple{ background: rgba(15,118,110,.18); }
@keyframes ripple{
  to{ transform: scale(4); opacity:0; }
}

/* Inputs */
.field{
  display:flex; flex-direction:column; gap:6px;
  font-family: system-ui, sans-serif;
}
.field label{ font-size:.8rem; color:var(--muted); font-weight:600; letter-spacing:.3px; text-transform:uppercase;}
.field input, .field select, .field textarea{
  appearance:none; -webkit-appearance:none;
  width:100%; padding: 12px 14px; min-height:46px;
  border-radius: 14px; border:1px solid var(--line);
  background: rgba(255,255,255,.85);
  color: var(--ink); font-size:1rem;
  font-family: system-ui, sans-serif;
  transition: border-color var(--anim) ease, box-shadow var(--anim) ease, background var(--anim) ease;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none;
  border-color: var(--teal-600);
  box-shadow: 0 0 0 4px rgba(20,149,139,.18);
  background:#fff;
}

/* Grid helpers */
.grid{ display:grid; gap:14px; }
.grid.cols-2{ grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid.cols-3{ grid-template-columns: repeat(1, minmax(0,1fr)); }
.grid.cols-4{ grid-template-columns: repeat(2, minmax(0,1fr)); }
@media(min-width:640px){
  .grid.cols-3{ grid-template-columns: repeat(3, minmax(0,1fr)); }
  .grid.cols-4{ grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media(min-width:900px){
  .grid.cols-4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
}

/* Tile cards (Classes / Subjects / Chapters) */
.tile{
  position:relative;
  padding: 18px;
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  border:1px solid var(--line);
  box-shadow: var(--shadow-sm);
  cursor:pointer;
  transition: transform var(--anim) ease, box-shadow var(--anim) ease, background var(--anim) ease;
  overflow:hidden;
}
.tile:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tile:active{ transform: translateY(0); }
.tile .tile-eyebrow{
  font-family: system-ui, sans-serif;
  font-size:.72rem; letter-spacing:.7px; text-transform:uppercase;
  color:var(--teal-700); font-weight:700;
}
.tile .tile-title{
  font-family:"Fraunces",serif; color:var(--teal-900);
  font-size:1.35rem; margin:6px 0 4px; line-height:1.15;
}
.tile .tile-sub{ color:var(--muted); font-size:.85rem; font-family: system-ui, sans-serif; }
.tile .tile-meta{
  display:flex; gap:10px; flex-wrap:wrap;
  margin-top: 12px;
  font-family: system-ui, sans-serif;
}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--mint-200); color: var(--teal-900);
  font-size:.72rem; font-weight:600; letter-spacing:.3px;
}
.chip.ok{ background: var(--success-soft); color: #065f46; }
.chip.warn{ background: var(--warn-soft); color: #92400e; }
.chip.err{ background: var(--danger-soft); color: #7f1d1d; }
.chip.dark{ background: var(--ink-2); color: #ccfbf1; }

/* Progress bar */
.pbar{
  height:8px; background: rgba(15,118,110,.12); border-radius:999px; overflow:hidden;
  margin-top:10px;
}
.pbar > span{
  display:block; height:100%;
  background: linear-gradient(90deg, var(--teal-600), var(--teal-500));
  border-radius:999px;
  transition: width var(--anim) ease;
}

/* Home welcome */
.hero{
  display:grid; gap:18px; grid-template-columns: 1fr;
  align-items:stretch;
}
@media(min-width:900px){ .hero{ grid-template-columns: 1.4fr 1fr; } }
.hero .welcome{
  padding: 22px;
  background: linear-gradient(135deg, rgba(15,118,110,.92), rgba(45,212,191,.85)), url("https://kommodo.ai/i/YIOOUA4S9v59nDQRdPnN") center/cover no-repeat;
  color:#e6fffb;
  border-radius: var(--radius-lg);
  border:1px solid rgba(255,255,255,.25);
  box-shadow: var(--shadow-lg);
  position:relative; overflow:hidden;
}
.hero .welcome::after{
  content:""; position:absolute; inset:auto -40px -40px auto;
  width:220px; height:220px;
  background: radial-gradient(closest-side, rgba(255,255,255,.35), transparent 70%);
  filter: blur(2px);
}
.hero .welcome h1{
  font-family:"Fraunces",serif; font-weight:700;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  margin:6px 0 8px; line-height:1.05;
}
.hero .welcome p{ margin:0; opacity:.92; font-family: system-ui, sans-serif;}
.hero .welcome .cta{ margin-top: 18px; display:flex; gap:10px; flex-wrap:wrap;}
.hero .welcome .cta .btn.soft{ background: rgba(255,255,255,.9); color: var(--teal-900); }
.hero .stats{
  padding:18px; display:grid; gap:10px;
  grid-template-columns: repeat(2, 1fr);
}
.stat{
  padding:14px; border-radius:16px;
  background: var(--glass-strong); border:1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-family: system-ui, sans-serif;
}
.stat .k{ font-size:.72rem; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; font-weight:700; }
.stat .v{ font-family:"Fraunces",serif; font-size:1.6rem; color:var(--teal-900); }

/* Chapter card grid */
.chapter-card{
  padding:16px;
  border-radius:20px;
  background: var(--glass-strong);
  border:1px solid var(--line);
  box-shadow: var(--shadow-sm);
  display:flex; flex-direction:column; gap:6px;
  cursor:pointer;
  transition: transform var(--anim) ease, box-shadow var(--anim) ease;
  position:relative;
}
.chapter-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
.chapter-card .head{ display:flex; align-items:center; justify-content:space-between; }
.chapter-card .num{ font-family:"Fraunces",serif; font-size:1.5rem; color:var(--teal-900); }
.chapter-card .tick{ width:26px; height:26px; border-radius:999px; display:grid; place-items:center; background: rgba(15,118,110,.08); color: var(--muted); }
.chapter-card.done .tick{ background: var(--success); color:#fff; }
.chapter-card .stats-row{ display:flex; gap:6px; flex-wrap:wrap; font-family: system-ui, sans-serif; font-size:.75rem; color:var(--muted); }
.chapter-card.empty{ opacity:.75; cursor:not-allowed; }
.chapter-card.empty::after{
  content:"Questions coming soon";
  font-family: system-ui, sans-serif;
  font-size:.7rem; letter-spacing:.5px; text-transform:uppercase;
  color: var(--warn); font-weight:700;
  margin-top:6px;
}

/* Quiz screen */
.quiz-head{
  display:grid; gap:12px;
  grid-template-columns: 1fr;
  margin-bottom:12px;
}
@media(min-width:700px){ .quiz-head{ grid-template-columns: 1.4fr 1fr; } }
.qh-card{
  padding:14px 16px; border-radius:18px; background:var(--glass-strong);
  border:1px solid var(--line); box-shadow:var(--shadow-sm);
  font-family: system-ui, sans-serif;
}
.qh-card .row{ display:flex; align-items:center; justify-content:space-between; gap:10px;}
.qh-card .row + .row{ margin-top:8px; }
.qh-card .label{ color:var(--muted); font-size:.75rem; letter-spacing:.4px; text-transform:uppercase; font-weight:700;}
.qh-card .value{ color:var(--teal-900); font-weight:700; font-family:"Fraunces",serif; }
.qh-score .value{ font-size:1.15rem; }

.timer-pill{
  display:inline-flex; align-items:center; gap:6px;
  padding: 4px 12px; border-radius:999px;
  background: var(--ink-2); color: var(--mint-200);
  font-family: "Fraunces",serif; font-weight:700; font-size:1rem;
  min-width:82px; justify-content:center;
}
.timer-pill.warn{ background:#7c2d12; color:#fed7aa; }
.timer-pill.danger{ background:#7f1d1d; color:#fecaca; animation: pulse 800ms ease-in-out infinite;}
@keyframes pulse{ 50%{ transform: scale(1.05); } }

.qbox{
  padding: 20px;
  border-radius: var(--radius-lg);
  background: var(--glass-strong);
  border:1px solid var(--line);
  box-shadow: var(--shadow-md);
}
.q-text{
  font-family:"Fraunces",serif;
  font-size: clamp(1.05rem, 3.5vw, 1.35rem);
  color: var(--teal-900);
  line-height:1.35;
  margin-bottom: 14px;
}
.options{ display:grid; gap:10px; }
.opt{
  --border: var(--line);
  --bg: rgba(255,255,255,.85);
  --fg: var(--ink);
  display:flex; align-items:center; gap:12px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  cursor:pointer;
  transition: transform var(--anim) ease, background var(--anim) ease, border-color var(--anim) ease, box-shadow var(--anim) ease;
  font-family: system-ui, sans-serif;
  font-size: .98rem;
  text-align:left;
}
.opt:hover{ background:#fff; border-color: var(--teal-600); }
.opt .badge{
  width:28px; height:28px; border-radius:999px; display:grid; place-items:center;
  background: var(--mint-200); color: var(--teal-800);
  font-weight:800; font-family:"Fraunces",serif;
}
.opt.correct{
  --border: #10b981; --bg: #ecfdf5; --fg:#065f46;
  animation: pop .3s ease;
}
.opt.correct .badge{ background: #10b981; color:white; }
.opt.wrong{
  --border: #ef4444; --bg: #fef2f2; --fg:#7f1d1d;
  animation: shake .35s ease;
}
.opt.wrong .badge{ background:#ef4444; color:white; }
.opt.locked{ cursor:not-allowed; }
@keyframes pop{ 0%{transform:scale(.98);} 60%{transform:scale(1.02);} 100%{transform:scale(1);} }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

.explanation{
  margin-top:14px; padding:14px; border-radius:14px;
  background: var(--mint-100); border:1px dashed var(--teal-600);
  color: var(--teal-900); font-family: system-ui, sans-serif;
  display:none;
}
.explanation.show{ display:block; animation: fade .4s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
.explanation strong{ color: var(--teal-800); }

.q-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:space-between;}
.q-actions .left, .q-actions .right{ display:flex; gap:8px; flex-wrap:wrap; }
.q-bookmark{
  appearance:none; border:0; background:transparent; cursor:pointer;
  width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
  color: var(--muted);
  transition: transform var(--anim) ease, color var(--anim) ease, background var(--anim) ease;
}
.q-bookmark:hover{ background: rgba(15,118,110,.08); }
.q-bookmark.active{ color:#eab308; transform: scale(1.08); }

/* Question navigator */
.navigator{
  display:grid; gap:8px;
  grid-template-columns: repeat(6, minmax(0,1fr));
  margin-top:16px;
}
@media(min-width:600px){ .navigator{ grid-template-columns: repeat(10, minmax(0,1fr));} }
@media(min-width:900px){ .navigator{ grid-template-columns: repeat(14, minmax(0,1fr));} }
.nav-cell{
  aspect-ratio:1; display:grid; place-items:center;
  border-radius: 10px; background: rgba(15,118,110,.10); color: var(--muted);
  font-family: "Fraunces",serif; font-weight:700; font-size:.85rem;
  cursor:pointer; border:1px solid transparent;
  transition: transform var(--anim) ease, background var(--anim) ease;
}
.nav-cell:hover{ transform: scale(1.06); }
.nav-cell.done{ background: #10b981; color:white; }
.nav-cell.wrongly{ background:#ef4444; color:white; }
.nav-cell.current{ border-color: var(--teal-700); background: rgba(20,149,139,.25); color: var(--teal-900); }

/* Result */
.result-hero{
  text-align:center; padding: 28px 18px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(15,118,110,.92), rgba(45,212,191,.85));
  color:#e6fffb; box-shadow: var(--shadow-lg);
}
.result-hero h1{ font-family:"Fraunces",serif; font-size: 2rem; margin:6px 0; }
.result-ring{
  --p:0;
  width:160px; height:160px; border-radius:999px;
  background: conic-gradient(#fff calc(var(--p)*1%), rgba(255,255,255,.25) 0);
  display:grid; place-items:center;
  margin: 12px auto;
  box-shadow: inset 0 0 0 8px rgba(255,255,255,.15);
}
.result-ring > div{
  width:130px; height:130px; border-radius:999px;
  background: var(--teal-800); color:#fff;
  display:grid; place-items:center;
  font-family:"Fraunces",serif; font-size:2rem;
}

/* Statistics — CSS-only bars */
.stat-grid{ display:grid; gap:12px; grid-template-columns: repeat(2, 1fr); }
@media(min-width:640px){ .stat-grid{ grid-template-columns: repeat(4, 1fr); } }
.stat-tile{
  padding:14px; border-radius:16px;
  background: var(--glass-strong); border:1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-family: system-ui, sans-serif;
}
.stat-tile .k{ font-size:.72rem; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:.5px; }

.bars{

@media(min-width:900px){ .botnav{ display:none; } .app{ padding-bottom: 40px; } }

/* Modal / dialogs */
.overlay{
  position:fixed; inset:0; z-index:60;

.switch{
  --w:46px; --h:26px;

<script>
/*==========================
  CONFIG
==========================*/
/**
 * Change this to swap the whole app background.
 * Just drop a "background.jpg" next to index.html or update the value.
 */
const BACKGROUND_IMAGE = "background.jpg";

/**
 * Syllabus definition — everything is generated from here.
 * Adding a new class/subject/chapter here will automatically appear
 * in the UI without any hardcoding.
 */
const syllabus = {
  6:{ history:12, polity:9,  geography:8,  science:16 },
  7:{ history:10, polity:9,  geography:10, science:18 },
  8:{ history:10, polity:10, geography:6,  science:18 },
  9:{ history:5,  polity:5,  economics:4,  geography:6,  science:15 },
  10:{ history:5, polity:8,  economics:5,  geography:7,  science:16 }
};

/**
 * Central CONFIG object. Everything is driven from here.
 */
const CONFIG = {
  background: BACKGROUND_IMAGE,
  syllabus,
  settings:{
    shuffleQuestions:false,
    shuffleOptions:false,
    timerMode:"none",     // none | 10 | 20 | 30 | custom
    timerCustom:15,       // minutes when timerMode === 'custom'
    blur:"med",           // off | low | med | high
    animSpeed:"normal",   // off | fast | normal | slow
    fontSize:"md"         // sm | md | lg | xl
  }
};

/*==========================
  DATA — QUESTION BANK
==========================*/
/**
 * questionBank is auto-generated from syllabus.
 * Structure: questionBank[class][subject][chapterKey] = []  (array of {question, answers, explanation})
 * Chapter keys are "chapter1", "chapter2", ...
 * Every question uses the format:
 *   { question:"14. Question", answers:[{text:"(a)...",correct:false}, ...], explanation:"..." }
 */
const questionBank = {};
(function buildEmptyBank(){
  for (const cls in syllabus){
    questionBank[cls] = {};
    for (const subj in syllabus[cls]){
      questionBank[cls][subj] = {};
      const total = syllabus[cls][subj];
      for (let i=1; i<=total; i++){
        questionBank[cls][subj]["chapter"+i] = []; // Placeholder — paste your questions here
      }
    }
  }
})();

/* ---- SAMPLE SEED QUESTIONS (for immediate testing) ---- */
/* ---- LOAD MULTIPLE JSON FILES DYNAMICALLY ---- */
async function loadAllChapters() {
  try {
    const fetchPromises = [];

    // Loop through your syllabus configuration to build file paths automatically
    for (const cls in syllabus) {
      for (const subj in syllabus[cls]) {
        const totalChapters = syllabus[cls][subj];
        for (let i = 1; i <= totalChapters; i++) {
          
          // Construct filename dynamically, e.g., "class-6-history-chapter1.json"
          const fileName = `class-${cls}-${subj}-chapter${i}.json`;

          // Push the fetch promise into an array
          const request = fetch(fileName)
            .then(response => {
              if (!response.ok) throw new Error(`Missing file: ${fileName}`);
              return response.json();
            })
            .then(data => {
              // Populate the specific slot in your questionBank structure
              questionBank[cls][subj][`chapter${i}`] = data;
            })
            .catch(err => {
              // Gracefully handle missing/uncreated chapter files without breaking the whole app
              console.warn(`Could not load ${fileName}:`, err.message);
            });

          fetchPromises.push(request);
        }
      }
    }

    // Wait for all fetch requests to complete
    await Promise.all(fetchPromises);
    console.log("All available question bank files loaded successfully!", questionBank);

    // Call your UI initialization function here once data is ready
    // e.g., initQuizApp();

  } catch (error) {
    console.error("Error loading question banks:", error);
  }
}

// Execute the loader
loadAllChapters();

/*==========================
  STATE
==========================*/
/**
 * Runtime state; per-user (mobile number) data lives in localStorage.
 */
const State = {
  mobile: null,                // currently logged-in mobile number
  route: "home",               // current view name
  breadcrumb: [],              // for the top breadcrumb
  quiz: null,                  // active quiz object
  timerTick: null,             // interval id
  toastTimer: null
};

/*==========================
  LOCAL STORAGE
==========================*/
/**
 * Storage keys are namespaced per mobile so multiple users can
 * share the same device without collisions.
 *   Gyani Learners::<mobile>::progress
 *   Gyani Learners::<mobile>::bookmarks
 *   Gyani Learners::<mobile>::wrong
 *   Gyani Learners::<mobile>::settings
 *   Gyani Learners::<mobile>::resume
 *   Gyani Learners::mobile   (last logged in)
 */
const Store = {
  key(kind){ return `Gyani Learners::${State.mobile}::${kind}`; },
  loadMobile(){ return localStorage.getItem("Gyani Learners::mobile"); },
  saveMobile(m){ localStorage.setItem("Gyani Learners::mobile", m); },
  clearMobile(){ localStorage.removeItem("Gyani Learners::mobile"); },

  getJSON(k, fb){
    try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : fb; }
    catch(e){ return fb; }
  },
  setJSON(k, v){ localStorage.setItem(k, JSON.stringify(v)); },

  progress(){ return this.getJSON(this.key("progress"), {}); },
  saveProgress(p){ this.setJSON(this.key("progress"), p); },
  bookmarks(){ return this.getJSON(this.key("bookmarks"), []); },
  saveBookmarks(b){ this.setJSON(this.key("bookmarks"), b); },
  wrong(){ return this.getJSON(this.key("wrong"), []); },
  saveWrong(w){ this.setJSON(this.key("wrong"), w); },
  settings(){ return this.getJSON(this.key("settings"), CONFIG.settings); },
  saveSettings(s){ this.setJSON(this.key("settings"), s); },
  resume(){ return this.getJSON(this.key("resume"), null); },
  saveResume(r){ this.setJSON(this.key("resume"), r); },
  clearResume(){ localStorage.removeItem(this.key("resume")); },

  /** Aggregate everything for export/reset */
  exportAll(){
    return {
      mobile: State.mobile,
      progress: this.progress(),
      bookmarks: this.bookmarks(),
      wrong: this.wrong(),
      settings: this.settings(),
      exportedAt: new Date().toISOString()
    };
  },
  importAll(obj){
    if (!obj || typeof obj !== "object") throw new Error("Invalid JSON");
    if (obj.progress) this.saveProgress(obj.progress);
    if (obj.bookmarks) this.saveBookmarks(obj.bookmarks);
    if (obj.wrong) this.saveWrong(obj.wrong);
    if (obj.settings) this.saveSettings(obj.settings);
  },
  resetAll(){
    localStorage.removeItem(this.key("progress"));
    localStorage.removeItem(this.key("bookmarks"));
    localStorage.removeItem(this.key("wrong"));
    localStorage.removeItem(this.key("resume"));
  }
};

/*==========================
  LOGIN
==========================*/
const Login = {
  render(){
    return `
      <section class="card solid" style="max-width:460px; margin: 20px auto;">
        <div class="center">
          <div class="brand-logo" style="width:56px;height:56px;font-size:26px;margin:0 auto 10px;">Q</div>
          <h2 style="font-family:'Fraunces',serif; color:var(--teal-900); margin:0 0 6px;">Welcome to Gyani Learners</h2>
          <p class="sub" style="margin:0 0 18px;">Sign in with your mobile number to save your progress on this device.</p>
        </div>
        <div class="field">
          <label for="loginMobile">Mobile Number (10 digits)</label>
          <input id="loginMobile" data-testid="login-mobile-input" inputmode="numeric" maxlength="10" pattern="\\d{10}" placeholder="9876543210"/>
          <div class="small" id="loginErr" style="color:var(--danger); min-height:16px;"></div>
        </div>
        <button class="btn block" data-testid="login-submit-btn" onclick="Login.submit()">
          Continue
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <div class="small center" style="margin-top:14px;">No password. No OTP. 100% offline.</div>
      </section>
    `;
  },
  attach(){
    const input = document.getElementById("loginMobile");
    input.addEventListener("input", e=>{
      e.target.value = e.target.value.replace(/\D/g,"").slice(0,10);
    });
    input.addEventListener("keydown", e=>{ if (e.key === "Enter") Login.submit(); });
    input.focus();
  },
  submit(){
    const val = (document.getElementById("loginMobile").value || "").trim();
    const err = document.getElementById("loginErr");
    if (!/^\d{10}$/.test(val)){
      err.textContent = "Please enter a valid 10-digit mobile number.";
      return;
    }
    err.textContent = "";
    State.mobile = val;
    Store.saveMobile(val);
    Settings.applyAll(Store.settings());
    toast("Signed in successfully");
    Nav.go("home");
  },
  logout(){
    Store.clearMobile();
    State.mobile = null;
    Nav.go("login");
  }
};

/*==========================
  NAVIGATION
==========================*/
const Nav = {
  routes: {},
  register(name, fn){ this.routes[name] = fn; },
  go(name, params){
    if (!State.mobile && name !== "login"){ name = "login"; }
    State.route = name;
    const el = document.getElementById("page");
    const fn = this.routes[name] || this.routes["home"];
    el.innerHTML = fn(params||{});
    // update crumb + botnav highlight
    Nav.updateCrumb();
    Nav.updateBotnav();
    // attach handlers for the current view if provided
    const attach = this.routes[name+":attach"];
    if (attach) attach(params||{});
    window.scrollTo({top:0, behavior:"smooth"});
  },
  setCrumb(items){ State.breadcrumb = items; Nav.updateCrumb(); },
  updateCrumb(){
    const el = document.getElementById("crumb");
    if (!el) return;
    if (State.route === "login" || !State.breadcrumb.length){ el.innerHTML = ""; return; }
    el.innerHTML = State.breadcrumb.map((c,i)=>{
      const isLast = i === State.breadcrumb.length-1;
      if (isLast) return `<span style="color:var(--teal-900); font-weight:600;">${escapeHTML(c.label)}</span>`;
      return `<a onclick="Nav.go('${c.to}', ${JSON.stringify(c.params||{}).replace(/"/g,'&quot;')})">${escapeHTML(c.label)}</a><span class="sep">›</span>`;
    }).join("");
  },
  updateBotnav(){
    document.querySelectorAll(".botnav button").forEach(b=>{
      b.classList.toggle("active", b.dataset.nav === State.route);
    });
  }
};

/*==========================
  HOME
==========================*/
const Home = {
  render(){
    Nav.setCrumb([]);
    const stats = Statistics.summary();
    const classCards = Object.keys(CONFIG.syllabus).map(cls=>{
      const subjectCount = Object.keys(CONFIG.syllabus[cls]).length;
      const total = totalChaptersInClass(cls);
      const done = completedChaptersInClass(cls);
      const pct = total ? Math.round(done/total*100) : 0;
      return `
        <div class="tile" data-testid="class-card-${cls}" onclick="Nav.go('class', {cls:'${cls}'})">
          <div class="tile-eyebrow">Grade</div>
          <div class="tile-title">Class ${cls}</div>
          <div class="tile-sub">${subjectCount} subjects · ${total} chapters</div>
          <div class="pbar"><span style="width:${pct}%"></span></div>
          <div class="tile-meta"><span class="chip">${done}/${total} done</span><span class="chip ok">${pct}%</span></div>
        </div>
      `;
    }).join("");

    const resume = Store.resume();
    const resumeBlock = resume ? `
      <div class="card solid" style="margin-bottom:14px; border-left: 4px solid var(--teal-600);">
        <div class="spread">
          <div>

  render(){

    const inp = document.getElementById("searchInput");
    inp.addEventListener("input", ()=> Search.filter(inp.value));
    Search.filter("");
    inp.focus();
  },
  filter(q){
    q = (q||"").toLowerCase().trim();
    const items = [];
    for (const cls in CONFIG.syllabus){
      for (const subj in CONFIG.syllabus[cls]){
        const total = CONFIG.syllabus[cls][subj];
        for (let i=1;i<=total;i++){
          const label = `Class ${cls} · ${cap(subj)} · Chapter ${i}`;
          const key = label.toLowerCase();
          if (!q || key.includes(q) || `class${cls}`.includes(q.replace(/\s+/,"")) ){
            items.push({cls, subj, i, label});
          }
        }
      }
    }
    const el = document.getElementById("searchList");
    if (!items.length){ el.innerHTML = `<div class="sub center" style="padding:14px;">No results</div>`; return; }
    el.innerHTML = items.slice(0,200).map(it=>{
      const bank = questionBank[it.cls][it.subj]["chapter"+it.i];
      const chip = bank.length ? `<span class="chip ok">${bank.length} Qs</span>` : `<span class="chip warn">Coming soon</span>`;
      return `
        <div class="search-item" data-testid="search-item-${it.cls}-${it.subj}-${it.i}" onclick="${bank.length?`Quiz.start({cls:'${it.cls}', subj:'${it.subj}', chapterNum:${it.i}})`:`toast('Questions coming soon')`}">

    }).join("");
  }
};

/*==========================
  STATISTICS
==========================*/
const Statistics = {
  summary(){
    const p = Store.progress();
    let attempted=0, correct=0, wrong=0, chaptersDone=0, chaptersTotal=0;
    let bestSum=0, bestCount=0, avgTimeSum=0, avgTimeCount=0, highest=0;
    for (const cls in CONFIG.syllabus){
      for (const subj in CONFIG.syllabus[cls]){
        const total = CONFIG.syllabus[cls][subj];
        for (let i=1;i<=total;i++){
          chaptersTotal++;
          const rec = p[`${cls}::${subj}::chapter${i}`];
          if (rec){
            attempted += rec.attempted || 0;
            correct += rec.correct || 0;
            wrong += rec.wrong || 0;
            if (rec.pct >= 100) chaptersDone++;
            if (typeof rec.highest === "number"){ bestSum += rec.highest; bestCount++; highest = Math.max(highest, rec.highest); }
            if (typeof rec.avgTime === "number" && rec.avgTime>0){ avgTimeSum += rec.avgTime; avgTimeCount++; }
          }
        }
      }
    }
    return {
      attempted, correct, wrong,
      accuracy: attempted ? Math.round(correct/attempted*100) : 0,
      chaptersDone, chaptersTotal,
      progressPct: chaptersTotal ? Math.round(chaptersDone/chaptersTotal*100) : 0,
      averageScore: bestCount ? Math.round(bestSum/bestCount) : 0,
      highestScore: highest,
      averageTime: avgTimeCount ? Math.round(avgTimeSum/avgTimeCount) : 0,
      bookmarks: Store.bookmarks().length,
      wrongCount: Store.wrong().length
    };
  },
  render(){
    Nav.setCrumb([{label:"Home", to:"home"}, {label:"Statistics"}]);
    const s = Statistics.summary();
    // Bar chart: accuracy per subject (aggregated across classes)
    const subjTotals = {};
    const p = Store.progress();
    for (const cls in CONFIG.syllabus){
      for (const subj in CONFIG.syllabus[cls]){
        const total = CONFIG.syllabus[cls][subj];
        for (let i=1;i<=total;i++){
          const rec = p[`${cls}::${subj}::chapter${i}`];
          if (!rec) continue;
          subjTotals[subj] = subjTotals[subj] || {a:0,c:0};
          subjTotals[subj].a += rec.attempted||0;
          subjTotals[subj].c += rec.correct||0;
        }
      }
    }
    const subjKeys = Object.keys(subjTotals);
    const bars = subjKeys.length ? subjKeys.map(k=>{
      const acc = subjTotals[k].a ? Math.round(subjTotals[k].c/subjTotals[k].a*100) : 0;
      return `<div class="bar" style="height:${Math.max(6, acc*1.6)}px"><em>${acc}%</em><span>${cap(k).slice(0,4)}</span></div>`;
    }).join("") : `<div class="sub" style="margin:auto;">No data yet — take a quiz!</div>`;

    return `
      <div class="section-title"><h2>Statistics</h2><span class="hint">Your overall performance</span></div>
      <div class="stat-grid">
        <div class="stat-tile"><div class="k">Attempted</div><div class="v" data-testid="stat-attempted">${s.attempted}</div></div>
        <div class="stat-tile"><div class="k">Correct</div><div class="v" style="color:var(--success)">${s.correct}</div></div>
        <div class="stat-tile"><div class="k">Wrong</div><div class="v" style="color:var(--danger)">${s.wrong}</div></div>
        <div class="stat-tile"><div class="k">Accuracy</div><div class="v">${s.accuracy}%</div></div>
        <div class="stat-tile"><div class="k">Chapters</div><div class="v">${s.chaptersDone}/${s.chaptersTotal}</div></div>
        <div class="stat-tile"><div class="k">Progress</div><div class="v">${s.progressPct}%</div></div>
        <div class="stat-tile"><div class="k">Avg Score</div><div class="v">${s.averageScore}%</div></div>
        <div class="stat-tile"><div class="k">Best Score</div><div class="v">${s.highestScore}%</div></div>
        <div class="stat-tile"><div class="k">Avg Time / Q</div><div class="v">${s.averageTime}s</div></div>
        <div class="stat-tile"><div class="k">Bookmarks</div><div class="v">${s.bookmarks}</div></div>
        <div class="stat-tile"><div class="k">Wrong Bank</div><div class="v">${s.wrongCount}</div></div>
        <div class="stat-tile"><div class="k">Signed in</div><div class="v" style="font-size:1rem;">${State.mobile}</div></div>
      </div>

      <div class="section-title"><h2>Accuracy by subject</h2></div>
      <div class="bars" style="padding: 24px 12px;">${bars}</div>
    `;
  }
};

const Random = {

      <div class="section-title"><h2>Random Practice</h2><span class="hint">Mix &amp; match any questions</span></div>
      <div class="card solid">
        <div class="grid cols-2">
          <div class="field">
            <label>Mode</label>
            <select id="rMode" data-testid="random-mode">
              <option value="all">Entire Database</option>
              <option value="class">Current Class</option>

            </select>

            <label>Count</label>
            <select id="rCount" data-testid="random-count">
              ${[10,20,30,50,100].map(n=>`<option value="${n}">${n} questions</option>`).join("")}
              <option value="all">All Questions</option>
              <option value="custom">Custom…</option>
            </select>
          </div>
          <div class="field" id="classWrap">
            <label>Class</label>
            <select id="rClass">${Object.keys(CONFIG.syllabus).map(c=>`<option value="${c}">Class ${c}</option>`).join("")}</select>
          </div>
          <div class="field" id="subjWrap">
            <label>Subject</label>
            <select id="rSubj"></select>
          </div>
          <div class="field" id="customWrap" style="display:none;">
            <label>Custom count</label>
            <input type="number" min="1" max="10000" id="rCustom" value="15"/>
          </div>
        </div>
        <div class="row" style="margin-top:14px; gap:8px; flex-wrap:wrap;">
          <button class="btn" data-testid="random-start" onclick="Random.start()">Start Random Quiz</button>
          <button class="btn ghost" onclick="Nav.go('home')">Cancel</button>
        </div>
        <div class="small" id="rHint" style="margin-top:8px;"></div>
      </div>
    `;
  },
  attach(){
    const modeEl = document.getElementById("rMode");
    const countEl = document.getElementById("rCount");
    const classEl = document.getElementById("rClass");
    const subjEl = document.getElementById("rSubj");
    const customWrap = document.getElementById("customWrap");
    const classWrap = document.getElementById("classWrap");
    const subjWrap = document.getElementById("subjWrap");
    const hint = document.getElementById("rHint");

    function updateSubjects(){
      const cls = classEl.value;
      subjEl.innerHTML = Object.keys(CONFIG.syllabus[cls]).map(s=>`<option value="${s}">${cap(s)}</option>`).join("");
    }
    function updateVis(){
      classWrap.style.display = modeEl.value === "all" ? "none" : "";
      subjWrap.style.display = modeEl.value === "subject" ? "" : "none";
      customWrap.style.display = countEl.value === "custom" ? "" : "none";
      updateHint();
    }
    function updateHint(){
      const pool = Random.collect(modeEl.value, classEl.value, subjEl.value);
      hint.textContent = `${pool.length} questions available in this pool.`;
    }
    modeEl.onchange = updateVis;
    countEl.onchange = updateVis;
    classEl.onchange = ()=>{ updateSubjects(); updateHint(); };
    subjEl.onchange = updateHint;
    updateSubjects(); updateVis();
  },
  collect(mode, cls, subj){
    const out = [];
    const push = (cls, subj, chapterKey, list)=>{
      list.forEach((q, idx)=> out.push({cls, subj, chapterKey, idx, q}));
    };
    if (mode === "all"){
      for (const c in questionBank) for (const s in questionBank[c]) for (const k in questionBank[c][s]) push(c,s,k, questionBank[c][s][k]);
    } else if (mode === "class"){
      for (const s in questionBank[cls]) for (const k in questionBank[cls][s]) push(cls,s,k, questionBank[cls][s][k]);
    } else {
      for (const k in questionBank[cls][subj]) push(cls,subj,k, questionBank[cls][subj][k]);
    }
    return out;
  },
  start(){
    const mode = document.getElementById("rMode").value;
    const cls = document.getElementById("rClass").value;
    const subj = document.getElementById("rSubj").value;
    const countSel = document.getElementById("rCount").value;
    let count;
    if (countSel === "all") count = Infinity;
    else if (countSel === "custom") count = Math.max(1, parseInt(document.getElementById("rCustom").value)||1);
    else count = parseInt(countSel);

    const pool = Random.collect(mode, cls, subj);
    if (!pool.length){ toast("No questions available in this pool yet"); return; }
    shuffle(pool);
    const chosen = pool.slice(0, isFinite(count) ? count : pool.length);
    Quiz.startCustom({
      title: `Random · ${cap(mode)} ${mode==='subject'?'· '+cap(subj):''} ${mode!=='all'?'· Class '+cls:''}`,
      questions: chosen.map(x=>({...x.q, __src:{cls:x.cls, subj:x.subj, chapterKey:x.chapterKey, idx:x.idx}})),
      mode:"random"
    });
  }
};

/*==========================
  QUIZ ENGINE
==========================*/
const Quiz = {
  /** Start a chapter quiz */
  start({cls, subj, chapterNum}){
    const chapterKey = "chapter"+chapterNum;
    const bank = questionBank[cls][subj][chapterKey] || [];
    if (!bank.length){ toast("Questions coming soon"); return; }
    const s = Store.settings();
    let questions = bank.map((q, idx)=> ({...q, __src:{cls, subj, chapterKey, idx}}));
    if (s.shuffleQuestions) shuffle(questions);
    if (s.shuffleOptions) questions = questions.map(q => ({...q, answers: shuffle([...q.answers])}));

    State.quiz = {
      title: `Class ${cls} · ${cap(subj)} · Chapter ${chapterNum}`,
      cls, subj, chapterNum, chapterKey,
      mode:"chapter",
      questions,
      current:0,
      answers:new Array(questions.length).fill(null), // selected option index (or null)
      lockedShown:new Array(questions.length).fill(false),
      correctCount:0, wrongCount:0,
      startedAt: Date.now(),
      totalTime: 0,           // seconds elapsed
      timerRemaining: computeTimerSeconds(s),
      timerPaused: false
    };
    Nav.go("quiz");
    Quiz.saveResume();
    Quiz.startTimer();
  },

  /** Start a custom (random/bookmark/wrong) quiz */
  startCustom({title, questions, mode}){
    const s = Store.settings();
    if (s.shuffleOptions) questions = questions.map(q => ({...q, answers: shuffle([...q.answers])}));
    State.quiz = {
      title, mode,
      questions,
      current:0,
      answers:new Array(questions.length).fill(null),
      lockedShown:new Array(questions.length).fill(false),
      correctCount:0, wrongCount:0,
      startedAt: Date.now(),
      totalTime: 0,
      timerRemaining: computeTimerSeconds(s),
      timerPaused:false
    };
    Nav.go("quiz");
    Quiz.startTimer();
  },

  resume(){
    const r = Store.resume();
    if (!r){ toast("Nothing to resume"); return; }
    State.quiz = r;
    Nav.go("quiz");
    Quiz.startTimer();
  },

  saveResume(){
    if (!State.quiz) return;
    if (State.quiz.mode !== "chapter") return; // only persist chapter quizzes
    const q = State.quiz;
    Store.saveResume({
      ...q,
      answered: q.answers.filter(a=>a!==null).length,
      total: q.questions.length
    });
  },

  render(){
    const q = State.quiz;
    if (!q){ Nav.go("home"); return ""; }

    if (q.mode === "chapter"){
      Nav.setCrumb([
        {label:"Home", to:"home"},
        {label:"Class "+q.cls, to:"class", params:{cls:q.cls}},
        {label:cap(q.subj), to:"subject", params:{cls:q.cls, subj:q.subj}},
        {label:"Chapter "+q.chapterNum}
      ]);
    } else {
      Nav.setCrumb([{label:"Home", to:"home"}, {label:q.title}]);
    }

    const cur = q.questions[q.current];
    const answered = q.answers[q.current];
    const locked = answered !== null;
    const progressPct = Math.round((q.current + (locked?1:0)) / q.questions.length * 100);
    const total = q.questions.length;
    const remaining = total - q.answers.filter(a=>a!==null).length;
    const accuracy = (q.correctCount+q.wrongCount) ? Math.round(q.correctCount/(q.correctCount+q.wrongCount)*100) : 0;
    const bookmarked = cur.__src ? Bookmarks.isBookmarked(cur.__src) : false;

    const timerHTML = q.timerRemaining !== null
      ? `<div class="timer-pill" id="timerPill" data-testid="quiz-timer">${formatTime(q.timerRemaining)}</div>`
      : `<div class="timer-pill" style="background:transparent;color:var(--muted);">No timer</div>`;

    const opts = cur.answers.map((a, idx)=>{
      const letter = String.fromCharCode(65+idx);
      let cls = "opt";
      if (locked){
        cls += " locked";
        if (a.correct) cls += " correct";
        if (idx === answered && !a.correct) cls += " wrong";
      }
      return `
        <button class="${cls}" data-testid="quiz-option-${idx}" onclick="${locked?'':`Quiz.pick(${idx})`}">
          <div class="badge">${letter}</div>
          <div>${escapeHTML(a.text)}</div>
        </button>`;
    }).join("");

    const explanation = locked && cur.explanation ? `
      <div class="explanation show">
        <strong>Explanation:</strong> ${escapeHTML(cur.explanation)}
      </div>
    ` : "";

    const navigator = `
      <div class="navigator" data-testid="quiz-navigator">
        ${q.questions.map((_, i)=>{
          const a = q.answers[i];
          let cls = "nav-cell";
          if (i === q.current) cls += " current";
          else if (a !== null){
            const isRight = q.questions[i].answers[a]?.correct;
            cls += isRight ? " done" : " wrongly";
          }
          return `<button class="${cls}" data-testid="quiz-nav-${i}" onclick="Quiz.goto(${i})">${i+1}</button>`;
        }).join("")}
      </div>`;

    return `
      <div class="quiz-head">
        <div class="qh-card">
          <div class="row" style="justify-content:space-between;">
            <div>
              <div class="label">${q.mode==="chapter"?"Chapter Quiz":"Custom Session"}</div>
              <div class="value" style="font-size:1.1rem;">${escapeHTML(q.title)}</div>
            </div>
            <button class="q-bookmark ${bookmarked?'active':''}" data-testid="quiz-bookmark" title="Bookmark question" onclick="Quiz.toggleBookmark()">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="${bookmarked?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 17.3-6.18 3.7 1.64-7.03L2 9.24l7.19-.61L12 2l2.81 6.63 7.19.61-5.46 4.73 1.64 7.03z"/></svg>
            </button>
          </div>
          <div class="pbar" style="margin-top:10px;"><span style="width:${progressPct}%"></span></div>
          <div class="row" style="justify-content:space-between; margin-top:8px;">
            <div class="small">Question ${q.current+1} of ${total} · ${remaining} remaining</div>
            ${timerHTML}
          </div>
        </div>
        <div class="qh-card qh-score">
          <div class="row"><span class="label">Score</span><span class="value" data-testid="quiz-score">${q.correctCount}/${q.correctCount+q.wrongCount}</span></div>
          <div class="row"><span class="label">Correct</span><span class="value" style="color:var(--success)">${q.correctCount}</span></div>
          <div class="row"><span class="label">Wrong</span><span class="value" style="color:var(--danger)">${q.wrongCount}</span></div>
          <div class="row"><span class="label">Accuracy</span><span class="value">${accuracy}%</span></div>
        </div>
      </div>

      <div class="qbox">
        <div class="q-text" data-testid="quiz-question">${escapeHTML(cur.question)}</div>
        <div class="options" data-testid="quiz-options">${opts}</div>
        ${explanation}
        <div class="q-actions">
          <div class="left">
            <button class="btn ghost" data-testid="quiz-prev" ${q.current===0?'disabled':''} onclick="Quiz.prev()">← Previous</button>
            ${q.timerRemaining!==null?`<button class="btn ghost" onclick="Quiz.togglePause()" data-testid="quiz-pause">${q.timerPaused?'Resume':'Pause'}</button>`:''}
          </div>
          <div class="right">
            <button class="btn soft" data-testid="quiz-finish" onclick="Quiz.finishConfirm()">Finish</button>
            <button class="btn" data-testid="quiz-next" ${!locked?'disabled':''} onclick="Quiz.next()">${q.current===total-1?'View Result':'Next →'}</button>
          </div>
        </div>
      </div>

      <div class="card solid" style="margin-top:12px;">
        <div class="section-title" style="margin:0 0 8px;"><h2 style="font-size:1.05rem;">Question Navigator</h2><span class="hint">Green = correct · Red = wrong · Blue = current</span></div>
        ${navigator}
      </div>
    `;
  },

  pick(idx){
    const q = State.quiz; if (!q) return;
    if (q.answers[q.current] !== null) return;
    q.answers[q.current] = idx;
    const isRight = !!q.questions[q.current].answers[idx].correct;
    if (isRight){
      q.correctCount++;
      // if this was in wrong bank, remove
      if (q.questions[q.current].__src) Wrong.removeIfCorrect(q.questions[q.current].__src);
    }else{
      q.wrongCount++;
      if (q.questions[q.current].__src) Wrong.record(q.questions[q.current].__src);
    }
    Quiz.saveResume();
    Nav.go("quiz");
  },

  goto(i){
    const q = State.quiz; if (!q) return;
    if (i<0 || i>=q.questions.length) return;
    q.current = i;
    Nav.go("quiz");
  },
  next(){
    const q = State.quiz; if (!q) return;
    if (q.current === q.questions.length - 1){ Quiz.finish(); return; }
    q.current++;
    Nav.go("quiz");
  },
  prev(){
    const q = State.quiz; if (!q) return;
    if (q.current>0){ q.current--; Nav.go("quiz"); }
  },
  toggleBookmark(){
    const q = State.quiz; if (!q) return;
    const cur = q.questions[q.current];
    if (!cur.__src){ toast("Cannot bookmark this question"); return; }
    const added = Bookmarks.add(cur.__src);
    toast(added ? "Bookmarked ⭐" : "Bookmark removed");
    Nav.go("quiz");
  },
  finishConfirm(){
    confirmDialog("Finish quiz?", "Any unanswered questions will be marked incomplete.", ()=> Quiz.finish());
  },
  finish(){
    const q = State.quiz; if (!q) return;
    Quiz.stopTimer();
    const total = q.questions.length;
    const correct = q.correctCount;
    const wrong = q.wrongCount;
    const answered = correct+wrong;
    const pct = total ? Math.round(correct/total*100) : 0;
    const timeTaken = q.totalTime;
    const accuracy = answered ? Math.round(correct/answered*100) : 0;
    // save progress if chapter quiz
    if (q.mode === "chapter"){
      const p = Store.progress();
      const key = `${q.cls}::${q.subj}::chapter${q.chapterNum}`;
      const prev = p[key] || {attempts:0, highest:0, correct:0, wrong:0, attempted:0, avgTime:0};
      const attempts = prev.attempts + 1;
      const highest = Math.max(prev.highest, pct);
      const avgTime = total ? Math.round(((prev.avgTime*prev.attempts) + (timeTaken/total)) / attempts) : prev.avgTime;
      p[key] = {
        attempts,
        highest,
        pct,
        correct: prev.correct + correct,
        wrong: prev.wrong + wrong,
        attempted: prev.attempted + answered,
        avgTime
      };
      Store.saveProgress(p);
      Store.clearResume();
    }
    State.quiz.__result = { total, correct, wrong, answered, pct, accuracy, timeTaken };
    Nav.go("result");
  },

  /* Timer */
  startTimer(){
    const q = State.quiz; if (!q) return;
    Quiz.stopTimer();
    State.timerTick = setInterval(()=>{
      if (!State.quiz) return Quiz.stopTimer();
      if (State.quiz.timerPaused) return;
      State.quiz.totalTime++;
      if (State.quiz.timerRemaining !== null){
        State.quiz.timerRemaining--;
        const pill = document.getElementById("timerPill");
        if (pill){
          pill.textContent = formatTime(State.quiz.timerRemaining);
          pill.classList.toggle("warn", State.quiz.timerRemaining <= 60 && State.quiz.timerRemaining > 15);
          pill.classList.toggle("danger", State.quiz.timerRemaining <= 15);
        }
        if (State.quiz.timerRemaining <= 0){
          Quiz.stopTimer();
          toast("Time's up — auto submitting");
          Quiz.finish();
        }
      }
    }, 1000);
  },
  stopTimer(){ if (State.timerTick) { clearInterval(State.timerTick); State.timerTick = null; } },
  togglePause(){
    const q = State.quiz; if (!q) return;
    q.timerPaused = !q.timerPaused;
    Nav.go("quiz");
  }
};

/*==========================
  HELPERS
==========================*/
function escapeHTML(s){
  return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cap(s){ if (!s) return s; return s.charAt(0).toUpperCase()+s.slice(1); }
function shuffle(arr){
  for (let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function totalChaptersInClass(cls){
  let n=0; for (const s in CONFIG.syllabus[cls]) n += CONFIG.syllabus[cls][s]; return n;
}
function completedChaptersInSubject(cls, subj){
  const p = Store.progress(); const total = CONFIG.syllabus[cls][subj]; let done=0;
  for (let i=1;i<=total;i++){ if ((p[`${cls}::${subj}::chapter${i}`]?.pct||0) >= 100) done++; }
  return done;
}
function completedChaptersInClass(cls){
  let done=0; for (const s in CONFIG.syllabus[cls]) done += completedChaptersInSubject(cls, s); return done;
}
function computeTimerSeconds(s){
  const m = s.timerMode;
  if (m === "none") return null;
  if (m === "custom") return Math.max(1, parseInt(s.timerCustom)||1) * 60;
  const n = parseInt(m); return isNaN(n) ? null : n*60;
}
function formatTime(sec){
  sec = Math.max(0, sec|0);
  const m = Math.floor(sec/60); const s = sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  if (State.toastTimer) clearTimeout(State.toastTimer);
  State.toastTimer = setTimeout(()=> el.classList.remove("show"), 1800);
}
function confirmDialog(title, message, onConfirm){
  const dlg = document.getElementById("dialog");
  dlg.innerHTML = `
    <h3>${escapeHTML(title)}</h3>
    <p>${escapeHTML(message)}</p>
    <div class="row" style="justify-content:flex-end; gap:8px;">
      <button class="btn ghost" data-testid="dialog-cancel" onclick="closeDialog()">Cancel</button>
      <button class="btn danger" data-testid="dialog-confirm" id="dlgConfirm">Confirm</button>
    </div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("dlgConfirm").onclick = ()=>{ closeDialog(); onConfirm(); };
}
function closeDialog(){ document.getElementById("overlay").classList.remove("show"); }

/* Ripple effect for buttons */
document.addEventListener("click", (e)=>{
  const btn = e.target.closest(".btn");
  if (!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const r = document.createElement("span");
  r.className = "ripple";
  r.style.width = r.style.height = size + "px";
  r.style.left = (e.clientX - rect.left - size/2) + "px";
  r.style.top  = (e.clientY - rect.top  - size/2) + "px";
  btn.appendChild(r);
  setTimeout(()=> r.remove(), 650);
});

/* Close overlay on backdrop click */
document.getElementById("overlay").addEventListener("click", e=>{
  if (e.target.id === "overlay") closeDialog();
});

  // Restore user session

    Settings.applyAll(Store.settings());
    Nav.go("home");

  }

  // Handle browser back/forward via hashless simple guard

  });
})();
